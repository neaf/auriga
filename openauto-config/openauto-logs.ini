[Core]
DisableLogging=false

[Sinks.Console]
Destination=Console
Filter="%Severity% >= info"
Asynchronous=false
AutoFlush=true
Format="%TimeStamp% [%Severity%] %Message%"

[Sinks.File]
Destination=TextFile
FileName=openauto.log
Filter="%Severity% >= info"
Asynchronous=false
AutoFlush=true
Format="%TimeStamp% [%Severity%] %Message%"
